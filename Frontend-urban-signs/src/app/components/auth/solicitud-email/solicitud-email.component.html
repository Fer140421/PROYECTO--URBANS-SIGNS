<div class="flex flex-col md:flex-row h-dvh w-dvw overflow-hidden">
    <!-- IZQUIERDA: Logo (header en móvil) -->
    <div
        class="w-full md:w-1/2 bg-black flex flex-row md:flex-col justify-between md:justify-center items-center p-3 sm:p-4 md:p-6 text-white">
        <!-- Versión móvil (header horizontal) -->
        <div class="flex items-center space-x-3 md:hidden">
            <img src="/img-logos/foto.png" alt="Urban Works Logo" class="w-10 sm:w-12 h-auto object-contain" />
            <h1 class="text-xl sm:text-2xl font-bold italic truncate">URBAN WORKS</h1>
        </div>

        <!-- Versión desktop -->
        <div class="hidden md:flex flex-col justify-center items-center w-full px-4">
            <img src="/img-logos/foto.png" alt="Urban Works Logo"
                class="w-[clamp(180px,30vw,500px)] h-auto mb-6 object-contain transition-all duration-300" />
            <h1
                class="text-[clamp(2rem,5vw,4.5rem)] font-bold italic text-center leading-tight transition-all duration-300">
                URBAN WORKS
            </h1>
        </div>
    </div>
    <div
        class="flex-1 md:w-1/2 flex items-center justify-center bg-yellow-500 relative overflow-auto py-8 sm:py-12 md:py-0 px-4 sm:px-6">
        <form [formGroup]="emailForm" (ngSubmit)="enviarCodigo()" class="w-full max-w-xs sm:max-w-sm md:max-w-md">
            <div
                class="bg-gradient-to-br from-gray-900 via-black to-gray-800 text-white p-6 sm:p-8 rounded-3xl w-full shadow-2xl border border-gray-700 relative">
                <div class="text-center mb-8 mt-8 sm:mt-4">
                    <div
                        class="inline-flex items-center justify-center w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-gradient-to-br from-yellow-400 to-yellow-500 mb-4 shadow-lg shadow-yellow-500/30">
                        <span class="text-3xl sm:text-4xl">📧</span>
                    </div>
                    <h2
                        class="text-lg sm:text-xl font-bold mb-2 bg-gradient-to-r from-yellow-400 to-yellow-500 bg-clip-text text-transparent py-2">
                        RECUPERAR CONTRASEÑA
                    </h2>
                    <p class="text-xs sm:text-sm text-gray-400 px-4">
                        Ingresa tu correo electrónico y te enviaremos un código de verificación
                    </p>
                </div>
                <div class="mb-6 sm:mb-7">
                    <label class="block text-xs sm:text-sm font-semibold mb-2 text-gray-300">
                        Correo Electrónico
                    </label>
                    <div class="relative group">
                        <div
                            class="absolute inset-0 bg-gradient-to-r from-yellow-400 to-yellow-500 rounded-2xl blur opacity-20 group-hover:opacity-40 transition duration-300">
                        </div>
                        <div class="relative flex items-center rounded-2xl px-4 py-3 bg-gray-800/50 backdrop-blur-sm border border-gray-700 transition-all duration-300"
                            [ngClass]="{
        'border-red-500 shadow-lg shadow-red-500/20': email.invalid && email.touched,
        'border-yellow-500 shadow-lg shadow-yellow-500/20': email.valid && email.touched,
        'hover:border-gray-600': !email.touched
      }">
                            <span class="text-xl mr-3 filter drop-shadow-md">📧</span>
                            <input type="email"
                                class="w-full bg-transparent focus:outline-none text-white placeholder-gray-500 text-sm sm:text-base"
                                placeholder="ejemplo@gmail.com" formControlName="email" />
                        </div>
                    </div>

                    <!-- Mensajes de validación -->
                    <div *ngIf="email.touched && email.invalid"
                        class="text-red-400 text-xs sm:text-sm mt-2 ml-1 flex items-center gap-1">
                        <span class="text-base">⚠</span>
                        <div>
                            <div *ngIf="email.hasError('required')">CAMPO OBLIGATORIO</div>
                            <div *ngIf="email.hasError('email')">CORREO ELECTRÓNICO NO VÁLIDO</div>
                        </div>
                    </div>

                    <!-- Mensaje de éxito -->
                    <div *ngIf="email.valid && email.touched"
                        class="text-yellow-400 text-xs sm:text-sm mt-2 ml-1 flex items-center gap-1">
                        <span class="text-base">✓</span>
                        <span>Correo válido</span>
                    </div>
                </div>
                <!-- Botón Enviar -->
                <button type="submit" [disabled]="emailForm.invalid || isLoading"
                    class="bg-gradient-to-r from-yellow-400 to-yellow-500 text-black font-bold px-4 py-3 sm:px-6 sm:py-3 rounded-2xl hover:from-yellow-500 hover:to-yellow-600 transition-all duration-300 w-full text-sm sm:text-base shadow-lg shadow-yellow-500/30 hover:shadow-yellow-500/50 hover:scale-[1.02] active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 flex items-center justify-center gap-2">
                    <ng-container *ngIf="!isLoading">
                        <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                        </svg>
                        <span>Enviar código</span>
                    </ng-container>
                    <ng-container *ngIf="isLoading">
                        <div class="w-5 h-5 border-2 border-black border-t-transparent rounded-full animate-spin"></div>
                        <span>Enviando código...</span>
                    </ng-container>
                </button>

                <!-- Error general -->
                <div *ngIf="mensajeError"
                    class="text-red-400 text-xs sm:text-sm mt-4 sm:mt-5 bg-red-500/10 border border-red-500/30 rounded-xl p-3 flex items-start gap-2 animate-shake">
                    <span class="text-lg">⚠️</span>
                    <span>{{ mensajeError }}</span>
                </div>

                <!-- Mensaje de éxito -->
                <div *ngIf="mensajeExito"
                    class="text-yellow-400 text-xs sm:text-sm mt-4 sm:mt-5 bg-yellow-500/10 border border-yellow-500/30 rounded-xl p-3 flex items-start gap-2 animate-fadeIn">
                    <span class="text-lg">✅</span>
                    <span>{{ mensajeExito }}</span>
                </div>

                <!-- Info adicional -->
                <div class="mt-6 text-center">
                    <p class="text-xs text-gray-500">
                        El código expirará en 5 minutos
                    </p>
                </div>
            </div>
        </form>
    </div>
</div>
