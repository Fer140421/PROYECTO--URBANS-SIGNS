<div class="flex flex-col md:flex-row h-dvh w-dvw overflow-hidden">
    <!-- IZQUIERDA: Logo -->
    <div
        class="w-full md:w-1/2 bg-black flex flex-row md:flex-col justify-between md:justify-center items-center p-3 sm:p-4 md:p-6 text-white">
        <!-- Versión móvil (header horizontal) -->
        <div class="flex items-center space-x-3 md:hidden">
            <img src="/img-logos/foto.png" alt="Urban Signs Logo" class="w-10 sm:w-12 h-auto object-contain" />
            <h1 class="text-xl sm:text-2xl font-bold italic truncate">URBAN WORKS</h1>
        </div>

        <!-- Versión desktop -->
        <div class="hidden md:flex flex-col justify-center items-center w-full">
            <img src="/img-logos/foto.png" alt="Urban Signs Logo"
                class="w-[250px] sm:w-[300px] md:w-[400px] lg:w-[500px] xl:w-[700px] h-auto mb-4 md:mb-8 object-contain" />
            <h1 class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl xl:text-8xl font-bold italic text-center px-4">URBAN
                WORKS</h1>
        </div>
    </div>

    <!-- DERECHA: Verificación -->
    <div
        class="flex-1 md:w-1/2 flex items-center justify-center bg-yellow-500 relative overflow-auto py-8 sm:py-12 md:py-0 px-4 sm:px-6">
        <form class="w-full max-w-lg sm:max-w-xl md:max-w-2xl">
            <div class="bg-white text-black p-6 sm:p-8 rounded-3xl w-full shadow-xl border border-gray-100">
                <h2 class="text-center text-lg sm:text-xl font-bold mb-6 bg-yellow-400 rounded-full py-2 sm:py-3">
                    Verificación de correo
                </h2>

                <p class="text-gray-600 mb-6 text-sm sm:text-base text-center">
                    Hemos enviado un código de verificación al correo
                    <span class="font-semibold text-black">{{ enteredEmail }}</span>
                    Por favor, introduce el código a continuación para continuar.
                </p>

                <!-- Cuadro de inputs para el código -->
                <div class="flex justify-center gap-2 sm:gap-3 md:gap-4 mb-6 overflow-x-auto max-w-full">
                    <input *ngFor="let digit of codeDigits; let i = index" type="text" data-preserve-case autocomplete="one-time-code" maxlength="1"
                        class="w-10 sm:w-12 md:w-14 h-12 md:h-14 text-center text-2xl font-bold border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#FFD000] focus:border-transparent shadow-sm transition"
                        [(ngModel)]="verificationCode[i]" (input)="autoFocusNext($event, i)"
                        (keydown.backspace)="autoFocusPrev($event, i)" [id]="'codeInput' + i"
                        [ngModelOptions]="{ standalone: true }" [disabled]="codeVerified || processing" />
                </div>

                <!-- Mensaje -->
                <div *ngIf="codeMessage" class="text-sm text-center mt-2" [ngClass]="{
            'text-green-600': messageType === 'success',
            'text-red-600': messageType === 'error'
        }">
                    {{ codeMessage }}
                </div>

                <!-- Botones -->
                <div class="flex justify-between items-center mt-6">
                    <button type="button" class="text-sm text-gray-500 hover:underline" (click)="resendCode()"
                        [disabled]="resendDisabled || codeVerified || processing">
                        <ng-container *ngIf="resendDisabled">
                            Reenviar código en {{ formatCountdown() }}
                        </ng-container>
                        <ng-container *ngIf="!resendDisabled">
                            Reenviar código
                        </ng-container>
                    </button>
                    <button type="button" [disabled]="verificationCode.join('').length < 6 || codeVerified || processing"
                        (click)="verifyEnteredCode()"
                        class="bg-[#FFD000] text-black px-6 py-2 rounded-xl font-semibold hover:bg-black hover:text-white transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
                        Verificar
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
