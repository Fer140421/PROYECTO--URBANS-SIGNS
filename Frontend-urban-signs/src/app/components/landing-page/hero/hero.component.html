<section id="hero" class="hero-section">
  <div class="hero-content">
    <h1 class="hero-title">
      <span class="text-yellow">URBAN</span>
      <span class="text-white">SIGNS</span>
    </h1>
    <p class="hero-subtitle">
      Transformando ideas en experiencias visuales desde 2010
    </p>
    
    <div class="hero-stats">
      <div class="stat-item">
        <span class="stat-number">13+</span>
        <span class="stat-label">Años</span>
      </div>
      <div class="stat-item">
        <span class="stat-number">500+</span>
        <span class="stat-label">Proyectos</span>
      </div>
      <div class="stat-item">
        <span class="stat-number">100%</span>
        <span class="stat-label">Calidad</span>
      </div>
    </div>
    
    <button (click)="scrollToContact()" class="cta-button">
      Solicitar Cotización
    </button>
  </div>

  <button (click)="scrollDown()" class="scroll-indicator">
    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
    </svg>
  </button>
</section>
