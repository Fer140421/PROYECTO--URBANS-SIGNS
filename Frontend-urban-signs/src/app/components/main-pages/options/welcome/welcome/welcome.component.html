<div class="min-h-[calc(100vh-80px)] bg-black flex flex-col items-center justify-center p-3 overflow-hidden relative">
  <!-- Fondo animado -->
  <div class="absolute inset-0 overflow-hidden">
    <div *ngFor="let circle of circles" class="absolute rounded-full bg-[#FFD000]/10 animate-float" [ngStyle]="{
           'width': circle.size + 'px',
           'height': circle.size + 'px',
           'left': circle.left + '%',
           'top': circle.top + '%',
           'animation-delay': circle.delay + 's'
         }"></div>
  </div>
  <div class="relative z-10 text-center space-y-8 animate-fade-in">
    <div class="flex flex-col items-center">
      <div class="relative">
        <img src="img-logos/foto.png" alt="Logo" class="w-32 h-32 mb-4 animate-bounce">
        <div class="absolute -inset-4 border-4 border-[#FFD000] rounded-full animate-ping-slow opacity-0"></div>
      </div>
      <h1 class="text-6xl font-bold text-[#FFD000] mb-2 animate-slide-down">
        URBAN <span class="text-white">WORKS</span>
      </h1>
      <p class="text-gray-300 text-lg max-w-md animate-slide-up">
        BIENVENIDO
      </p>
    </div>
    <div class="bg-black/80 border-2 border-[#FFD000] rounded-xl p-6 max-w-md mx-auto animate-scale-in">
      <h2 class="text-2xl font-bold text-[#FFD000] mb-2">¡Hola, {{userName}}!</h2>
      <p class="text-gray-300 mb-4">Tu sesión ha sido iniciada correctamente</p>
    </div>
  </div>
  <div class="absolute bottom-6 text-gray-500 text-sm animate-fade-in">
    © {{currentYear}} BitFusion - Todos los derechos reservados
  </div>
</div>
