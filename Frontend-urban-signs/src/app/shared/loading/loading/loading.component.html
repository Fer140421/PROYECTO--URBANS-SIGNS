<div
  class="w-full"
  [ngClass]="fullscreen
    ? 'fixed inset-0 z-50 flex min-h-screen items-center justify-center bg-white/90 p-6 backdrop-blur-sm dark:bg-gray-900/90'
    : 'overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm'"
  role="status"
  aria-live="polite"
  [attr.aria-label]="label">

  <span class="sr-only">{{ label }}</span>

  <div *ngIf="variant === 'table'" class="w-full overflow-hidden">
    <div class="flex items-center justify-between border-b border-gray-100 bg-gray-50/80 px-5 py-4">
      <div class="skeleton h-5 w-40"></div>
      <div class="skeleton h-8 w-24 rounded-lg"></div>
    </div>
    <div class="overflow-x-auto px-5">
      <div class="grid min-w-[640px] gap-6 border-b border-gray-100 py-4" [style.grid-template-columns]="'repeat(' + columns + ', minmax(0, 1fr))'">
        <div *ngFor="let column of columnItems" class="skeleton h-3 w-20"></div>
      </div>
      <div *ngFor="let row of rowItems" class="grid min-w-[640px] items-center gap-6 border-b border-gray-100 py-5 last:border-0" [style.grid-template-columns]="'repeat(' + columns + ', minmax(0, 1fr))'">
        <div *ngFor="let column of columnItems; let first = first" class="min-w-0">
          <div *ngIf="first" class="flex items-center gap-3">
            <div class="skeleton h-9 w-9 shrink-0 rounded-lg"></div>
            <div class="min-w-0 space-y-2">
              <div class="skeleton h-3 w-28 max-w-full"></div>
              <div class="skeleton h-2 w-20 max-w-full"></div>
            </div>
          </div>
          <div *ngIf="!first" class="skeleton h-3 w-24 max-w-full"></div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="variant === 'cards'" class="grid grid-cols-1 gap-5 p-5 sm:grid-cols-2 xl:grid-cols-4">
    <div *ngFor="let card of rowItems" class="overflow-hidden rounded-xl border border-gray-200 bg-white">
      <div class="skeleton h-40 w-full rounded-none"></div>
      <div class="space-y-4 p-4">
        <div class="skeleton h-4 w-3/4"></div>
        <div class="space-y-2">
          <div class="skeleton h-3 w-full"></div>
          <div class="skeleton h-3 w-5/6"></div>
        </div>
        <div class="flex items-center justify-between border-t border-gray-100 pt-4">
          <div class="skeleton h-8 w-20 rounded-lg"></div>
          <div class="skeleton h-8 w-24 rounded-lg"></div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="variant === 'list'" class="divide-y divide-gray-100">
    <div *ngFor="let row of rowItems" class="flex items-center gap-4 px-5 py-5">
      <div class="skeleton h-12 w-12 shrink-0 rounded-full"></div>
      <div class="min-w-0 flex-1 space-y-2">
        <div class="skeleton h-4 w-44 max-w-[70%]"></div>
        <div class="skeleton h-3 w-28 max-w-[50%]"></div>
      </div>
      <div class="hidden gap-2 sm:flex">
        <div class="skeleton h-8 w-24 rounded-lg"></div>
        <div class="skeleton h-8 w-8 rounded-lg"></div>
      </div>
    </div>
  </div>
</div>
