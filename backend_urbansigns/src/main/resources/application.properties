spring.application.name=urban_signs

# Carga opcional de la configuracion local ignorada por Git.
spring.config.import=optional:file:./.env[.properties]

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urban_signs}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Para desarrollo local, definir DB_USERNAME y DB_PASSWORD en el entorno.
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA e Hibernate
spring.jpa.properties.hibernate.jdbc.time_zone=America/La_Paz
spring.jackson.time-zone=America/La_Paz
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.date-format=dd/MM/yyyy HH:mm:ss
spring.jackson.locale=es-BO

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#Configuracion de claves secretas
jwt.secret.key=${JWT_SECRET}
# Access token: 15 minutos. El refresh token mantiene la sesión hasta 14 días.
jwt.time.expiration=900000
jwt.refresh.expiration=1209600000
jwt.cookies.secure=${JWT_COOKIES_SECURE:true}
jwt.cookies.same-site=${JWT_COOKIES_SAMESITE:None}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

logging.level.org.springframework.web=${LOGGING_LEVEL_WEB:INFO}
logging.level.org.springframework.http=${LOGGING_LEVEL_HTTP:INFO}

# Para evitar problemas con archivos binarios
spring.servlet.multipart.resolve-lazily=true
spring.servlet.multipart.enabled=true

#Para eliminacion actualizacion o insercion a la bd, consultas por lotes
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}

# Credenciales inyectadas por variables de entorno
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


facturacion.api.url=${FACTURACION_API_URL:https://facturador.soft-solution.org/api/v1/facturacion/electronica}
facturacion.api.token=${FACTURACION_API_TOKEN}
